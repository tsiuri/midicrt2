[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midicrt2"
version = "2.0.0.dev0"
description = "MIDI-CRT visualizer v2: engine daemon + protocol clients"
requires-python = ">=3.13"
dependencies = ["mido>=1.3", "python-rtmidi>=1.5", "blessed>=1.20", "pillow>=10", "evdev>=1.6", "numpy>=1.26", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
midicrtd = "midicrt.daemon:main"
midicrt = "midicrt.clients.cli:main"
midicrt-fb = "midicrt.clients.fb.app:main"
midicrt-web = "midicrt.clients.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>midicrt-web</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #0b0f0c; color: #7CFF9E;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: #123018; border-bottom: 1px solid #1f4a29;
    flex-wrap: wrap; gap: 8px;
  }
  #status { font-weight: bold; letter-spacing: 0.02em; }
  #conn { padding: 2px 8px; border-radius: 4px; font-size: 0.8em; }
  #conn.up { background: #1f4a29; color: #7CFF9E; }
  #conn.down { background: #4a1f1f; color: #ff8a8a; }
  nav { display: flex; gap: 6px; padding: 8px 12px; flex-wrap: wrap; }
  nav button, #controls button {
    background: #123018; color: #7CFF9E; border: 1px solid #2b6b3a;
    padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: inherit;
    font-size: 0.9em;
  }
  nav button.current { background: #2b6b3a; color: #fff; }
  nav button:disabled { opacity: 0.5; cursor: default; }
  nav button:not(:disabled):hover, #controls button:not(:disabled):hover { background: #1f4a29; }
  main { padding: 12px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 2px 8px; text-align: left; }
  .bar-track { display: inline-block; width: 120px; height: 10px; background: #17251a; vertical-align: middle; }
  .bar-fill { display: inline-block; height: 10px; background: #2b6b3a; }
  .bar-fill.active { background: #7CFF9E; }
  #eventlog { white-space: pre-wrap; font-size: 0.92em; line-height: 1.4; max-height: 65vh; overflow-y: auto; }
  #eventlog .accent { color: #fff; font-weight: bold; }
  pre.json { white-space: pre-wrap; word-break: break-all; font-size: 0.85em; }
  #controls { padding: 10px 12px; border-top: 1px solid #1f4a29; display: none; flex-direction: column; gap: 8px; }
  #controls.enabled { display: flex; }
  #controls form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #controls select, #controls input {
    background: #0b0f0c; color: #7CFF9E; border: 1px solid #2b6b3a; padding: 3px 6px;
    font-family: inherit;
  }
  #action-args { display: flex; gap: 6px; flex-wrap: wrap; }
  #action-args input { width: 10em; }
  #action-result { font-size: 0.85em; opacity: 0.85; }
  /* -- REC indicator (phase6-notes item 6): status bar text already
     carries chrome.py's REC_MARKER glyph; this class is the extra VISUAL
     cue driven straight off the vm's own `rec` boolean (see renderStatus)
     rather than re-parsing the rendered string for it. */
  #status.recording { color: #ff6b6b; }
  /* -- capture controls (phase6-notes item 6, --allow-control only) ------- */
  #capture-panel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #rec-toggle.recording { background: #4a1f1f; border-color: #7a2b2b; color: #ff8a8a; }
  #last-session { font-size: 0.85em; opacity: 0.85; }
  /* -- alert banners (phase6-notes item 4): dismissable, `level`-colored -- */
  #alerts { padding: 0 12px; }
  .alert-banner {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: #4a3a1f; color: #ffdca8; border: 1px solid #7a5b2b; border-radius: 4px;
    padding: 6px 10px; margin: 6px 0; font-size: 0.9em;
  }
  .alert-banner.alert-crit { background: #4a1f1f; color: #ffb3b3; border-color: #7a2b2b; }
  .alert-banner button {
    background: transparent; border: none; color: inherit; cursor: pointer;
    font-weight: bold; font-size: 1em; font-family: inherit; padding: 0 4px;
  }
  /* -- learn toasts (phase6-notes item 4): transient, auto-dismissing ----- */
  #toast-container {
    position: fixed; bottom: 12px; right: 12px; display: flex; flex-direction: column;
    gap: 6px; z-index: 10;
  }
  .toast {
    background: #123018; color: #7CFF9E; border: 1px solid #2b6b3a; border-radius: 4px;
    padding: 6px 12px; font-size: 0.85em; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  /* -- harmony page chips (chord/scale history slots) --------------------- */
  .chip {
    display: inline-block; background: #123018; border: 1px solid #2b6b3a;
    border-radius: 3px; padding: 1px 6px; margin: 2px 4px 2px 0; font-size: 0.9em;
  }
  /* -- img2txtviz ascii grid: tight monospace, no wrap ---------------------*/
  .ascii-grid { line-height: 1.05; letter-spacing: 0; font-size: 10px; }
  /* -- pianoroll / spectrum canvases ---------------------------------------*/
  #page-body canvas { display: block; width: 100%; height: auto; margin-top: 6px; background: #0b0f0c; }
</style>
</head>
<body>
<header>
  <div id="status">connecting…</div>
  <div id="conn" class="down">disconnected</div>
</header>
<nav id="pages"></nav>
<div id="alerts"></div>
<main id="page-body">waiting for first snapshot…</main>
<div id="controls">
  <div>
    <button data-action="page.prev">◀ prev page</button>
    <button data-action="page.next">next page ▶</button>
  </div>
  <div id="capture-panel">
    <button id="rec-toggle" type="button">● start REC</button>
    <span id="last-session">last session: (none yet)</span>
  </div>
  <form id="action-form">
    <select id="action-select"></select>
    <span id="action-args"></span>
    <button type="submit">run action</button>
  </form>
  <div id="action-result"></div>
</div>
<div id="toast-container"></div>
<script>
const ALLOW_CONTROL = __ALLOW_CONTROL__;

const statusEl = document.getElementById("status");
const connEl = document.getElementById("conn");
const pagesEl = document.getElementById("pages");
const bodyEl = document.getElementById("page-body");
const controlsEl = document.getElementById("controls");
const actionSelect = document.getElementById("action-select");
const actionArgsEl = document.getElementById("action-args");
const actionResultEl = document.getElementById("action-result");
const actionForm = document.getElementById("action-form");
const alertsEl = document.getElementById("alerts");
const toastContainerEl = document.getElementById("toast-container");
const recToggleEl = document.getElementById("rec-toggle");
const lastSessionEl = document.getElementById("last-session");

let describeCache = null;
let currentPage = null;
let recording = false;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

// -- status bar: the bridge renders this string server-side via
// clients/chrome.py's status_text() (docs/phase6-notes.md item 1,
// merge-reconciliation fix) and ships it alongside the raw vm as
// `status_text` -- displayed here VERBATIM (`textContent`, so it's
// auto-escaped) instead of this page keeping its own JS copy of the
// format. That old copy had already drifted from chrome.py's real output
// (no `rec`/REC_MARKER handling at all) -- one rendering path now, so it
// can never drift again. `rec` (phase6-notes item 6) drives a SEPARATE
// visual cue (a CSS class) straight off the vm's own boolean -- the
// rendered TEXT already has chrome.py's REC_MARKER glyph baked in, but a
// class lets CSS style the whole status bar, not just prepend a glyph.
function renderStatus(text, rec) {
  statusEl.textContent = text || "connecting…";
  statusEl.classList.toggle("recording", !!rec);
  recording = !!rec;
  if (ALLOW_CONTROL) updateRecToggle();
}

// -- alert banners (phase6-notes item 4): dismissable, stacked, newest
// last. Alert payload SHAPE varies by source (engine/core.py's capture
// write-failure alert carries {source, level, message}; analyzers/
// stucknotes.py's own alerts carry {ch, note, level, held_s}, no
// `message` at all) -- formatAlert() copes with either rather than
// assuming one canonical shape.
let alerts = [];
let alertSeq = 0;

function formatAlert(a) {
  let text;
  if (a.message) text = a.message;
  else if (a.note != null) text = `stuck note: ch${a.ch} note${a.note} (${a.held_s}s, ${a.level})`;
  else text = JSON.stringify(a);
  // bridge.py's WebSink._offer_alert stamps a cumulative `dropped_alerts`
  // count onto every alert offered after its bounded queue (16 outstanding)
  // has to drop the oldest one to make room -- surface it, since otherwise
  // a burst-heavy session would silently lose alerts even with the
  // backend fix (the count exists but nobody would ever see it).
  if (a.dropped_alerts) text += `  (+${a.dropped_alerts} earlier alert(s) dropped)`;
  return text;
}

function renderAlerts() {
  alertsEl.innerHTML = alerts.map((a) => {
    const level = a.level === "crit" ? "alert-crit" : "";
    return `<div class="alert-banner ${level}">` +
      `<span>${escapeHtml(formatAlert(a))}</span>` +
      `<button data-dismiss="${a.id}" aria-label="dismiss">×</button></div>`;
  }).join("");
}

function pushAlert(data) {
  alerts.push({ id: ++alertSeq, ...data });
  renderAlerts();
}

alertsEl.addEventListener("click", (ev) => {
  const id = ev.target && ev.target.dataset && ev.target.dataset.dismiss;
  if (id == null) return;
  alerts = alerts.filter((a) => String(a.id) !== id);
  renderAlerts();
});

// -- learn toasts (phase6-notes item 4): transient, self-dismissing after
// a few seconds -- unlike alerts (which stay until a human dismisses
// them), a learn arm/bind/cancel is a momentary confirmation, not an
// ongoing condition worth pinning to the screen.
function showToast(text) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  toastContainerEl.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// -- capture controls (phase6-notes item 6, --allow-control only): a
// dedicated REC toggle (capture.start/.stop, mirroring the generic action
// dropdown's own capture.* entries but one click instead of two) + a
// last_session panel kept current by polling capture.status (on control
// enable, and again whenever a capture_started/capture_stopped event
// arrives -- see handleMessage below).
function updateRecToggle() {
  if (!recToggleEl) return;
  recToggleEl.textContent = recording ? "■ stop REC" : "● start REC";
  recToggleEl.classList.toggle("recording", recording);
}

function renderLastSession(session) {
  if (!lastSessionEl) return;
  if (!session) { lastSessionEl.textContent = "last session: (none yet)"; return; }
  const counts = Object.entries(session.counts || {})
    .map(([k, v]) => `${k}:${v}`).join(" ") || "(no events)";
  const errTxt = session.error ? `  error: ${session.error}` : "";
  lastSessionEl.textContent = `last session: ${session.id}  ${counts}${errTxt}`;
}

async function refreshCaptureStatus() {
  if (!ALLOW_CONTROL) return;
  try {
    const res = await fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: "capture.status", args: {} }),
    });
    if (!res.ok) return;
    const data = await res.json();
    recording = !!data.recording;
    updateRecToggle();
    renderLastSession(data.last_session);
  } catch (e) { /* best-effort -- overlay.status will catch up recording state anyway */ }
}

// -- nav roster: describe's `topics` (page.* entries, roster/cycle order)
// -- NOT the alphabetized `pages` list, which is display-only (see
// engine/server.py's own comment on the `describe` response). Using
// `pages` here would show buttons in alphabetical order while page.next/
// page.prev cycle in roster order -- clicking the nav wouldn't match
// what the keyboard/CLI actions actually do.
function pageRoster(describe) {
  return (describe.topics || [])
    .filter((t) => typeof t === "string" && t.startsWith("page."))
    .map((t) => t.slice("page.".length));
}

function renderPageNav(current, pages) {
  pagesEl.innerHTML = "";
  (pages || []).forEach((name) => {
    const btn = document.createElement("button");
    btn.textContent = name;
    if (name === current) btn.className = "current";
    if (ALLOW_CONTROL) {
      btn.addEventListener("click", () => postAction("page.goto", { name }));
    } else {
      btn.disabled = true;
    }
    pagesEl.appendChild(btn);
  });
}

// -- per-page renderers (thin: markup only, no protocol logic) ------------
function renderEventlog(vm) {
  const lines = (vm.lines || []).map((ln) => {
    const cls = ln.style === "accent" ? "accent" : "";
    return `<span class="${cls}">${escapeHtml(ln.text)}</span>`;
  }).join("\n");
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong> (${vm.count} events)</div>` +
    `<div id="eventlog">${lines}</div>`;
  const log = document.getElementById("eventlog");
  if (log) log.scrollTop = log.scrollHeight;
}

function renderVoices(vm) {
  const rows = (vm.rows || []).map((r) => {
    const pct = Math.max(0, Math.min(100, Math.round((r.active / 8) * 100)));
    const fillCls = r.active > 0 ? "bar-fill active" : "bar-fill";
    return `<tr>
      <td>${String(r.ch).padStart(2, "0")}</td>
      <td>${escapeHtml(r.name)}</td>
      <td><span class="bar-track"><span class="${fillCls}" style="width:${pct}%"></span></span></td>
      <td>${r.active}/${r.peak}</td>
    </tr>`;
  }).join("");
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong> (poly ${vm.total}/${vm.total_peak})</div>` +
    `<table><thead><tr><th>ch</th><th>name</th><th>level</th><th>active/peak</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>`;
}

// -- harmony page (pages/harmony.py + analyzers/harmony.py's view-model):
// chord/scale history chips, inside/outside note sets, key + tension bar --
// mirrors clients/tui.py's `_harmony_body_lines` layout, just as markup
// instead of fixed-width text rows.
function chipsRow(label, items) {
  const chips = (items || []).map((it) => {
    const conf = it.conf != null ? ` ${Math.round(it.conf * 100)}%` : "";
    return `<span class="chip">${escapeHtml(it.name || "--")}${conf}</span>`;
  }).join("");
  return `<div><strong>${escapeHtml(label)}</strong> ${chips || "-"}</div>`;
}

function renderHarmony(vm) {
  const tensionPct = Math.round((vm.tension || 0) * 100);
  const worst = vm.tension_worst_interval ? ` [${escapeHtml(vm.tension_worst_interval)}]` : "";
  const alts = (vm.key_alternatives || []).length
    ? `  (alts: ${vm.key_alternatives.map(escapeHtml).join(", ")})` : "";
  const keyConf = vm.key_conf != null ? ` ${Math.round(vm.key_conf * 100)}%` : "";
  const rhythm = (vm.harmonic_rhythm && vm.harmonic_rhythm.label) || "-";
  const motif = (vm.motif && vm.motif.found)
    ? `${escapeHtml(vm.motif.pattern)}  x${vm.motif.count}` : "-";
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong></div>` +
    chipsRow("Chords:", vm.chords) +
    chipsRow("Scales:", vm.scales) +
    `<div>Inside: ${(vm.inside || []).join(" ") || "-"}` +
    `&nbsp;&nbsp;Outside: ${(vm.outside || []).join(" ") || "-"}</div>` +
    `<div>Key: ${escapeHtml(vm.key || "?")}${keyConf}${alts}</div>` +
    `<div>Tension: <span class="bar-track"><span class="bar-fill active" ` +
    `style="width:${tensionPct}%"></span></span> ${(vm.tension || 0).toFixed(2)} ` +
    `${escapeHtml(vm.tension_label || "")}${worst}</div>` +
    `<div>Harm. rhythm: ${escapeHtml(rhythm)}</div>` +
    `<div>Motif: ${motif}</div>`;
}

// -- pianoroll page (pages/pianoroll.py): the engine already emits
// normalized [0,1] x0/x1/y/vel coordinates -- this renderer's only job is
// scaling that onto a <canvas>, then coloring each note by channel + a
// velocity-driven "charred" brightness ramp, the SAME palette/blend
// clients/fb/app.py's `_ROLL_CHANNEL_PALETTE`/`_roll_note_color` use for
// its own pixel-CRT rendering (kept in sync by hand -- there is no shared
// module a browser and a Python framebuffer client can both import).
const PIANOROLL_CHANNEL_PALETTE = [
  [255, 60, 60], [255, 170, 40], [255, 230, 40], [80, 230, 80],
  [60, 200, 255], [90, 110, 255], [200, 90, 255], [255, 90, 190],
];
const PIANOROLL_DIM_FRACTION = 0.25;

function rollNoteColor(ch, vel) {
  const hue = PIANOROLL_CHANNEL_PALETTE[(Math.max(1, ch | 0) - 1) % PIANOROLL_CHANNEL_PALETTE.length];
  const v = Math.max(0, Math.min(1, vel));
  const frac = PIANOROLL_DIM_FRACTION + (1 - PIANOROLL_DIM_FRACTION) * v;
  return `rgb(${Math.round(hue[0] * frac)}, ${Math.round(hue[1] * frac)}, ${Math.round(hue[2] * frac)})`;
}

function renderPianoroll(vm) {
  const w = vm.window || {};
  const r = vm.range || {};
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong> (${escapeHtml(w.mode || "")} zoom ` +
    `${(w.zoom || 0).toFixed(2)}, range ${r.lo}-${r.hi})</div>` +
    `<canvas id="pianoroll-canvas" height="360"></canvas>`;
  const canvas = document.getElementById("pianoroll-canvas");
  canvas.width = Math.max(200, Math.floor(bodyEl.clientWidth) - 4);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0b0f0c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const rowH = 6;
  (vm.notes || []).forEach((n) => {
    const x0 = n.x0 * canvas.width;
    const x1 = Math.max(x0 + 2, n.x1 * canvas.width);
    const y = n.y * (canvas.height - rowH);
    ctx.fillStyle = rollNoteColor(n.ch, n.vel);
    ctx.fillRect(x0, y, x1 - x0, rowH);
  });
}

// -- spectrum page (analyzers/spectrum.py): bar-per-bin canvas + peak-hold
// ticks -- the canvas equivalent of clients/tui.py's `_spectrum_bar_rows`
// block-character bars.
function renderSpectrum(vm) {
  const deviceLine = vm.available
    ? `(device: ${escapeHtml(vm.device || "default")})` : "";
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong> ${deviceLine}</div>` +
    `<canvas id="spectrum-canvas" height="240"></canvas>`;
  const canvas = document.getElementById("spectrum-canvas");
  canvas.width = Math.max(200, Math.floor(bodyEl.clientWidth) - 4);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0b0f0c";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!vm.available) {
    ctx.fillStyle = "#7CFF9E";
    ctx.font = "14px monospace";
    ctx.fillText("no audio input", 10, canvas.height / 2);
    return;
  }
  const bins = vm.bins || [];
  const peaks = vm.peak_hold || [];
  const n = bins.length;
  if (n === 0) return;
  const barW = canvas.width / n;
  ctx.fillStyle = "#2b6b3a";
  bins.forEach((v, i) => {
    const h = Math.max(0, Math.min(1, v)) * canvas.height;
    ctx.fillRect(i * barW, canvas.height - h, Math.max(1, barW - 1), h);
  });
  ctx.fillStyle = "#7CFF9E";
  peaks.forEach((v, i) => {
    const y = canvas.height - Math.max(0, Math.min(1, v)) * canvas.height;
    ctx.fillRect(i * barW, Math.max(0, y - 1), Math.max(1, barW - 1), 2);
  });
}

// -- CC monitor page (pages/ccmonitor.py): one row per channel, its recent
// CC:value window as text -- mirrors clients/tui.py's `_ccmonitor_row_text`
// (no natural bar scale for an arbitrary controller number, same reasoning
// that renderer's own comment gives).
function renderCcMonitor(vm) {
  const rows = (vm.channels || []).map((c) => {
    const cells = (c.recent || [])
      .map((e) => `CC${String(e.cc).padStart(2, "0")}:${String(e.value).padStart(3, "0")}`)
      .join(" ");
    return `<tr><td>${String(c.ch).padStart(2, "0")}</td><td>${cells || "-"}</td></tr>`;
  }).join("");
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong></div>` +
    `<table><thead><tr><th>ch</th><th>recent CCs</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// -- CC dashboard page (pages/ccdashboard.py): one row per TRACKED
// (channel, cc) pair with a value bar + freshness label -- mirrors
// clients/tui.py's `_ccdashboard_row_text`/`_ccdashboard_bar`.
function renderCcDashboard(vm) {
  const rows = (vm.entries || []).map((e) => {
    const pct = Math.max(0, Math.min(100, Math.round((e.value / 127) * 100)));
    const age = e.fresh ? "LIVE" : `${e.age_s.toFixed(1)}s`;
    const fillCls = e.fresh ? "bar-fill active" : "bar-fill";
    return `<tr>
      <td>Ch${String(e.ch).padStart(2, "0")}</td>
      <td>CC${String(e.cc).padStart(3, "0")}</td>
      <td>${e.value}</td>
      <td><span class="bar-track"><span class="${fillCls}" style="width:${pct}%"></span></span></td>
      <td>${age}</td>
    </tr>`;
  }).join("");
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong></div>` +
    `<table><thead><tr><th>ch</th><th>cc</th><th>value</th><th>level</th><th>age</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>`;
}

// -- chord+key page (pages/chordkey.py): chord candidate table + key line
// -- mirrors clients/tui.py's `_chordkey_key_lines`/`_chordkey_body_lines`.
function renderChordKey(vm) {
  const chordRows = (vm.chords || []).map((c) =>
    `<tr><td>${escapeHtml(c.label)}</td><td>${c.pct}%</td><td>${(c.missing || []).join(" ") || "-"}</td></tr>`
  ).join("");
  const key = vm.key || {};
  let keyLine;
  if (!key.label) {
    keyLine = key.top ? `Key: ?  top:${escapeHtml(key.top.label)} ${key.top.pct}%` : "Key: ?";
  } else {
    const tag = key.ambiguous ? "~" : "=";
    keyLine = `Key${tag} ${escapeHtml(key.label)}  ${key.pct}% (thr ${key.threshold_pct}%)`;
  }
  const alts = (key.alternatives || [])
    .map((a) => `${escapeHtml(a.label)} ${a.pct}%`).join(" | ");
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong></div>` +
    `<div>Recent: ${(vm.recent_pcs || []).join(" ") || "-"}</div>` +
    `<table><thead><tr><th>chord</th><th>match</th><th>missing</th></tr></thead>` +
    `<tbody>${chordRows}</tbody></table>` +
    `<div>${keyLine}</div>` +
    (alts ? `<div>alts: ${alts}</div>` : "") +
    (vm.function ? `<div>Function: ${escapeHtml(vm.function)}</div>` : "");
}

// -- send notes page (pages/sendnotes.py): plain status table -- mirrors
// clients/tui.py's `_sendnotes_status_text`.
function renderSendNotes(vm) {
  const rows = [
    ["device", vm.device || "(not open)"],
    ["channel", vm.channel],
    ["octave", vm.octave],
    ["velocity", vm.velocity],
    ["gate_ms", vm.gate_ms],
    ["active notes", vm.active],
  ];
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong></div>` +
    `<table><tbody>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${escapeHtml(v)}</td></tr>`).join("")}</tbody></table>`;
}

// -- shared label/value table renderer for help/config (both pages/
// help.py's and pages/configview.py's view-models are already flat
// {label, value} row lists -- see each page module's own docstring) -----
function labelValueRows(rows) {
  return (rows || []).map((r) => `<tr><td>${escapeHtml(r.label)}</td><td>${escapeHtml(r.value)}</td></tr>`).join("");
}

function renderHelp(vm) {
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong></div>` +
    `<table><tbody>${labelValueRows(vm.page_rows)}</tbody></table>` +
    `<div style="margin-top:8px"><strong>-- Actions --</strong></div>` +
    `<table><tbody>${labelValueRows(vm.action_rows)}</tbody></table>` +
    `<div style="margin-top:8px"><strong>-- Keymap --</strong></div>` +
    `<table><tbody>${labelValueRows(vm.keymap_rows)}</tbody></table>`;
}

function renderConfig(vm) {
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong></div>` +
    `<div><strong>-- Config --</strong></div>` +
    `<table><tbody>${labelValueRows(vm.config_rows)}</tbody></table>` +
    `<div style="margin-top:8px"><strong>-- Engine --</strong></div>` +
    `<table><tbody>${labelValueRows(vm.engine_rows)}</tbody></table>`;
}

// -- img2txtviz page (analyzers/img2txtviz.py): the engine already emits a
// fixed grid of final [0,1] brightness values with `invert` baked in --
// this renderer's only job is quantizing each cell through `vm.charset`
// (already darkest-to-brightest) into a glyph, same index math as
// clients/tui.py's `_img2txtviz_grid_lines`, rendered at native grid
// resolution inside a <pre> instead of upsampled to a terminal raster.
function renderImg2TxtViz(vm) {
  const charset = vm.charset || " ";
  const n = charset.length;
  const lines = (vm.grid || []).map((row) =>
    row.map((v) => charset[Math.min(n - 1, Math.max(0, Math.floor(v * n)))]).join("")
  ).join("\n");
  const flags = vm.invert ? "INV " : "";
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong> notes:${String(vm.active_notes).padStart(2, "0")} ` +
    `energy:${vm.energy.toFixed(2)} splash:${vm.vel_splash.toFixed(2)} ${flags}</div>` +
    `<pre class="ascii-grid">${escapeHtml(lines)}</pre>`;
}

// -- screensaver page (pages/screensaver.py): deliberately blank, matching
// every other client's own render_screensaver_lines/_frame (a blank CRT
// is the intended behavior here, not a missing renderer).
function renderScreensaver() {
  bodyEl.innerHTML = "";
}

// -- tuner page (analyzers/tuner.py, live-wired Phase 9 Task 3): note/
// cents/confidence/level readout + the v1 ASCII needle gauge -- mirrors
// clients/tui.py's/fb/app.py's own `_tuner_body_lines`/`render_tuner_
// frame`, including a straight JS port of `analyzers/tuner.py::
// tuning_meter` (no shared-source mechanism across Python/JS in this
// codebase, same "renderer reproduces the engine's already-tested math"
// precedent this file's own `renderSpectrum` follows for spectrum's bars).
// Three states, same precedence order as the other two clients: no audio
// hardware -> "no audio input" (mirrors renderSpectrum's identical text);
// audio present but no pitch locked -> "Listening..."; locked -> note +
// meter.
function tuningMeterText(cents, width) {
  width = Math.max(7, Math.floor(width));
  const center = Math.floor(width / 2);
  let pos = center + Math.round((cents / 50.0) * center);
  pos = Math.max(0, Math.min(width - 1, pos));
  const chars = new Array(width).fill("-");
  chars[center] = "|";
  chars[pos] = "^";
  return chars.join("");
}

function renderTuner(vm) {
  // Fix round (review finding 2): device-in-title-line, same convention
  // renderSpectrum's own `deviceLine` already established -- v1's status
  // line (pages/tuner.py:172-174) ported following spectrum's v2 idiom,
  // same as clients/fb/app.py::_tuner_header_text/clients/tui.py's
  // identical fix.
  const deviceLine = vm.available
    ? `(device: ${escapeHtml(vm.device || "default")})` : "";
  if (!vm.available) {
    bodyEl.innerHTML =
      `<div><strong>${escapeHtml(vm.title)}</strong></div>` +
      `<div>no audio input</div>`;
    return;
  }
  if (!vm.has_signal) {
    bodyEl.innerHTML =
      `<div><strong>${escapeHtml(vm.title)}</strong> ${deviceLine}</div>` +
      `<div>Listening...  Conf:${vm.confidence.toFixed(2)}  Level:${vm.db.toFixed(1)} dB</div>`;
    return;
  }
  const centsText = `${vm.cents >= 0 ? "+" : ""}${vm.cents.toFixed(1)}`;
  const meter = tuningMeterText(vm.cents, 40);
  bodyEl.innerHTML =
    `<div><strong>${escapeHtml(vm.title)}</strong> ${deviceLine}</div>` +
    `<div>Note:${escapeHtml(vm.note)}  Pitch:${vm.hz.toFixed(2)} Hz  ` +
    `Cents:${centsText}  Conf:${vm.confidence.toFixed(2)}  Level:${vm.db.toFixed(1)} dB</div>` +
    `<pre class="ascii-grid">Tuning: ${escapeHtml(meter)}</pre>`;
}

// Any future page this build has no dedicated renderer for still shows up
// (ugly but visible) as raw JSON -- mirrors clients/tui.py's/fb/app.py's
// own `_render_unknown` fallback contract: wire compat is additive-only.
function renderUnknown(topic, vm) {
  bodyEl.innerHTML =
    `<div>(no renderer for <code>${escapeHtml(topic)}</code> yet -- raw snapshot below)</div>` +
    `<pre class="json">${escapeHtml(JSON.stringify(vm, null, 2))}</pre>`;
}

// Observer parity (phase6-notes item 3): one entry per default-roster page
// name (see config.py::Config.pages for the real 15-name list this must
// track) -- "progchanges" reuses renderEventlog verbatim since
// pages/progchanges.py's own module docstring documents it as
// deliberately sharing eventlog's exact `{title, count, lines}` shape.
// Keys are quoted strings (not bare identifiers) so the roster-coverage
// test (test_web_app.py) can grep the served JS for `"<name>":` per page
// without needing a browser to execute it. "tuner" added Phase 9 Task 3
// (live pitch detection finally wired, joined the default roster).
const PAGE_RENDERERS = {
  "eventlog": renderEventlog,
  "progchanges": renderEventlog,
  "voices": renderVoices,
  "harmony": renderHarmony,
  "pianoroll": renderPianoroll,
  "spectrum": renderSpectrum,
  "ccmonitor": renderCcMonitor,
  "ccdashboard": renderCcDashboard,
  "chordkey": renderChordKey,
  "sendnotes": renderSendNotes,
  "help": renderHelp,
  "config": renderConfig,
  "img2txtviz": renderImg2TxtViz,
  "screensaver": renderScreensaver,
  "tuner": renderTuner,
};

function renderPage(topic, vm) {
  const name = topic.replace(/^page\./, "");
  const renderer = PAGE_RENDERERS[name] || ((v) => renderUnknown(topic, v));
  renderer(vm);
}

// -- websocket message dispatch --------------------------------------------
// -- connection indicator (#conn): TWO independent legs feed this ONE
// element. `ws.addEventListener("close"/"error", ...)` below (browser <->
// midicrt-web) still sets it directly -- unchanged from before this task.
// The bridge <-> midicrtd leg (Phase 9 Task 4: the engine daemon itself
// restarting) is Option B (user ruling): THIS browser's websocket stays
// open across that outage -- it never sees a close/error frame -- so
// without this, #conn would keep reading "connected" the whole time even
// though nothing is actually updating (the exact misleading-dashboard
// symptom docs/phase6-web.md §7 used to document as a bug). `hello`'s own
// "status" field (a fresh/reconnecting websocket's first frame) and the
// live `bridge_status` event (already-open sinks, mid-session) both route
// through this one function -- reusing the SAME indicator element rather
// than adding a second one, per the task's own "wire it if cheap" ask.
function renderConnStatus(status) {
  connEl.textContent = status;
  connEl.className = status === "connected" ? "up" : "down";
}

function handleMessage(msg) {
  if (msg.kind === "hello") {
    currentPage = msg.page;
    renderConnStatus(msg.status || "connected");
    if (describeCache) renderPageNav(currentPage, pageRoster(describeCache));
    return;
  }
  if (msg.kind === "snapshot") {
    if (msg.topic === "overlay.status") {
      renderStatus(msg.status_text, msg.data && msg.data.rec);
      return;
    }
    if (typeof msg.topic === "string" && msg.topic.startsWith("page.")) {
      renderPage(msg.topic, msg.data);
    }
    return;
  }
  if (msg.kind !== "event") return;
  // -- new-surface events (phase6-notes item 4): alert/learn/capture. Every
  // OTHER event kind (including any future addition) is silently ignored
  // here, same additive-only wire-compat stance renderUnknown's own
  // comment documents for pages -- an unrecognized event name is not an
  // error, just nothing new to show yet.
  if (msg.name === "page_changed") {
    currentPage = msg.data.page;
    if (describeCache) renderPageNav(currentPage, pageRoster(describeCache));
  } else if (msg.name === "bridge_status") {
    // Phase 9 Task 4: the bridge<->midicrtd leg reconnecting/recovering --
    // see renderConnStatus's own comment. `msg.data` is always present for
    // this event (bridge.py always attaches {"status": ...}), but guard it
    // anyway, same defensive style every other handler here already uses.
    renderConnStatus((msg.data && msg.data.status) || "connected");
  } else if (msg.name === "alert") {
    pushAlert(msg.data || {});
  } else if (msg.name === "learn_armed") {
    showToast(`learn armed: ${(msg.data && msg.data.action) || "?"}`);
  } else if (msg.name === "learn_bound") {
    // Review fix (Minor): guard `msg.data` itself, not just its nested
    // `.binding`, same defensive style renderStatus already uses for
    // `msg.data && msg.data.rec` -- a malformed/future-shaped frame with
    // no `data` at all must not throw here.
    const action = (msg.data && msg.data.binding && msg.data.binding.action) || "?";
    showToast(`learn bound: ${action}`);
  } else if (msg.name === "learn_cancelled") {
    showToast(`learn cancelled (${(msg.data && msg.data.reason) || "?"})`);
  } else if (msg.name === "capture_started" || msg.name === "capture_stopped") {
    refreshCaptureStatus();  // authoritative source: capture.status, not the event payload alone
  }
}

// -- /api/describe: page roster (topics, roster order) + action schema
// (control surface) -----------------------------------------------------
async function loadDescribe() {
  try {
    const res = await fetch("/api/describe");
    describeCache = await res.json();
    // Seed currentPage from describe's current_page (docs/phase6-notes.md
    // item 2) when the `hello` ws frame hasn't landed yet -- fetch() and
    // the websocket connect race, so describe can resolve first.
    if (currentPage === null) currentPage = describeCache.current_page;
    renderPageNav(currentPage, pageRoster(describeCache));
    if (ALLOW_CONTROL) populateActionSelect(describeCache.actions || {});
  } catch (e) {
    // describe is a nice-to-have for nav/control; snapshots still render without it.
  }
}

function populateActionSelect(actions) {
  actionSelect.innerHTML = "";
  Object.keys(actions).sort().forEach((name) => {
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name;
    actionSelect.appendChild(opt);
  });
  actionSelect.addEventListener("change", () => renderActionArgs(actions));
  renderActionArgs(actions);
}

function renderActionArgs(actions) {
  actionArgsEl.innerHTML = "";
  const schema = (actions[actionSelect.value] || {}).args || {};
  Object.entries(schema).forEach(([argName, type]) => {
    const input = document.createElement("input");
    input.placeholder = `${argName} (${type})`;
    input.dataset.arg = argName;
    actionArgsEl.appendChild(input);
  });
}

// -- control surface: POST /api/action (hidden entirely when ALLOW_CONTROL
// is false -- the server independently 403s these even if a browser
// forges the request, see app.py's _handle_action) ------------------------
async function postAction(name, args) {
  try {
    const res = await fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, args: args || {} }),
    });
    const data = await res.json();
    actionResultEl.textContent = res.ok ? JSON.stringify(data) : `error: ${data.error}`;
  } catch (e) {
    actionResultEl.textContent = `error: ${e}`;
  }
}

if (ALLOW_CONTROL) {
  controlsEl.classList.add("enabled");
  controlsEl.querySelectorAll("button[data-action]").forEach((btn) => {
    btn.addEventListener("click", () => postAction(btn.dataset.action, {}));
  });
  actionForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const args = {};
    actionArgsEl.querySelectorAll("input").forEach((inp) => { args[inp.dataset.arg] = inp.value; });
    postAction(actionSelect.value, args);
  });
  recToggleEl.addEventListener("click", () => {
    postAction(recording ? "capture.stop" : "capture.start", {});
  });
  refreshCaptureStatus();  // seed the REC toggle label + last_session panel on load
}

// -- websocket connection with auto-reconnect + exponential backoff -------
let backoff = 500;
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.addEventListener("open", () => { backoff = 500; });
  ws.addEventListener("message", (ev) => {
    try { handleMessage(JSON.parse(ev.data)); } catch (e) { /* ignore malformed frame */ }
  });
  ws.addEventListener("close", () => {
    renderConnStatus("disconnected");
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 10000);
  });
  ws.addEventListener("error", () => ws.close());
}

loadDescribe();
connect();
</script>
